<!DOCTYPE html>
<html lang="de-AT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vorübergehende Störung — elevenOne</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#FFFDFA">
  <!-- Serverfehler-Seite (Launchgrade §10): nur Inline-CSS, keine externen Dateien, kein JavaScript.
       Ausgeliefert von Nginx bei 500/502/503/504 (docs/nginx-config.md). -->
  <style>
    html { background: #FFFDFA; color: #0A0806; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.5; }
    main { max-width: 34rem; padding: 2rem 1.5rem; }
    .mark { font-family: ui-monospace, "Courier New", monospace; font-size: .75rem; letter-spacing: .15em;
            color: #A84221; text-transform: uppercase; }
    h1 { font-size: clamp(2.5rem, 8vw, 4rem); line-height: 1.05; letter-spacing: -.025em; margin: .5rem 0 1rem; }
    p { color: #564A3A; margin: 0 0 1rem; }
    a { color: #A84221; font-weight: 600; }
    a:focus-visible { outline: 2px solid #8C5E0F; outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <p class="mark">§ ERR.500 — Vorübergehende Störung</p>
    <h1>Kurz nicht erreichbar</h1>
    <p>Die Website der elevenOne GmbH ist gerade gestört. Bitte versuchen Sie es in ein paar Minuten noch einmal.</p>
    <p>Sie erreichen uns jederzeit per E-Mail: <a href="mailto:info@elevenone.at">info@elevenone.at</a></p>
    <p><a href="/">Zur Startseite</a></p>
  </main>
</body>
</html>
